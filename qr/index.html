<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUÏ DESIGN - Recorrido Sonoro</title>
    <style>
        :root {
            --bg-color: #121316;
            --card-bg: #1c1e22;
            --accent-color: #52b766;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background: #121316 url('https://res.cloudinary.com/dcxs5vqkb/image/upload/v1781757443/Textura_verde_wrusl5.avif') repeat;
            background-size: 180px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .landing-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 40px;
        }

        .image-hero {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .image-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-panel {
            background-color: var(--card-bg);
            border: 1px solid #2e3238;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            fill: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: fill 0.2s ease;
            flex-shrink: 0;
        }

        .control-btn:hover {
            fill: var(--text-main);
        }

        .btn-play-pause {
            background-color: var(--accent-color);
            fill: #121316;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }

        .btn-play-pause:hover {
            fill: #121316;
            transform: scale(1.05);
        }

        .btn-play-pause:active {
            transform: scale(0.95);
        }

        .progress-timeline {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .progress-container {
            width: 100%;
            background-color: #2e3238;
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            background-color: var(--accent-color);
            height: 100%;
            border-radius: 3px;
            position: relative;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .content-header {
            text-align: center;
            padding: 0 8px;
        }

        .main-title {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 24px;
        }

        .description-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-main);
            text-align: justify;
            font-weight: 300;
        }
    </style>
</head>
<body>

<div class="landing-container">
    <div class="image-hero">
        <img id="heroImage" src="" alt="">
    </div>

    <div class="player-panel">
        <button class="control-btn btn-play-pause" id="playBtn" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24" style="width: 24px; height: 24px;"><path d="M8 5v14l11-7z"/></svg>
        </button>
        
        <div class="progress-timeline">
            <div class="progress-container" id="progressContainer" onclick="seekAudio(event)">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>
    </div>

    <div class="content-header">
        <h1 class="main-title" id="mainTitle"></h1>
        <p class="subtitle" id="subtitle"></p>
        <p class="description-text" id="descriptionText"></p>
    </div>
</div>

<audio id="audioTrack" ontimeupdate="updateProgress()" onloadedmetadata="initDuration()"></audio>

<script>
    const audio = document.getElementById('audioTrack');
    const playIcon = document.getElementById('playIcon');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    async function cargarEstacion() {
        // Leer el parámetro ?id= de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const estacionId = urlParams.get('id') || 'loica'; // 'loica' se carga si no hay parámetro
        
        try {
            const response = await fetch('estaciones.json');
            const estaciones = await response.json();
            const datos = estaciones[estacionId];
            
            if (!datos) {
                console.error('Estación no encontrada:', estacionId);
                return;
            }
            
            // Inyectar datos en el HTML
            document.getElementById('heroImage').src = datos.imagen;
            document.getElementById('heroImage').alt = datos.titulo;
            document.getElementById('mainTitle').innerHTML = datos.titulo;
            document.getElementById('subtitle').textContent = datos.subtitulo;
            document.getElementById('descriptionText').textContent = datos.descripcion;
            audio.src = datos.audioUrl;
            
            document.title = 'KUÏ DESIGN - ' + datos.titulo.replace(/<br>/g, ' ');
            
        } catch (error) {
            console.error('Error al cargar la estación:', error);
        }
    }

    cargarEstacion();

    function togglePlay() {
        if (audio.paused) {
            audio.play().catch(err => console.log("Error al reproducir:", err));
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        } else {
            audio.pause();
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
    }

    function updateProgress() {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
        }
    }

    function initDuration() {
        durationEl.textContent = formatTime(audio.duration);
    }

    function seekAudio(e) {
        if (audio.duration) {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        }
    }

    function formatTime(time) {
        if (isNaN(time)) return "0:00";
        const mins = Math.floor(time / 60);
        const secs = Math.floor(time % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
</script>

</body>
</html>
